name: Ares Emulator Setup

on:
  workflow_dispatch:

jobs:
  install-ares:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
      - name: Add Flathub
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install ares
        run: |
          sudo flatpak install --system --noninteractive -y flathub dev.ares.ares
      - name: Verify ares
        run: |
          flatpak info --system dev.ares.ares
          flatpak list --system --app
